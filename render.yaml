## Render Blueprint — GameSense Cricket Analytics
## https://render.com/docs/blueprint-spec
##
## External prerequisite: Kafka is not provided by Render.
## Create a free Kafka cluster on Confluent Cloud (https://confluent.cloud) or
## Upstash Kafka (https://upstash.com/kafka), then supply the three KAFKA_*
## env vars below that are marked `sync: false`.
##
## After blueprint is applied, set VITE_API_URL on the frontend service
## to the backend's Render URL (e.g. https://gamesense-backend.onrender.com).

databases:
  - name: gamesense-db
    databaseName: gamesense
    user: gamesense
    plan: free

services:
  # ── Managed Redis ──────────────────────────────────────────────────────────
  - type: redis
    name: gamesense-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  - type: web
    name: gamesense-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gamesense-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gamesense-redis
          property: connectionString
      # ── Kafka (supply values from your cloud Kafka provider) ──
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: PLAIN
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      # ── App secrets ──
      - key: CRICAPI_KEY
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: "900"
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # ── React Frontend (static site) ───────────────────────────────────────────
  - type: web
    name: gamesense-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # Set this to your backend Render URL after first deploy
      # e.g. https://gamesense-backend.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
